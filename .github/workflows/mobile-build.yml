# PlayNxt Mobile App - EAS Build Pipeline
# Triggers EAS builds on push to main

name: Mobile Build

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc --noEmit

      - name: Determine build parameters
        id: build-params
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "platform=${{ github.event.inputs.platform }}" >> $GITHUB_OUTPUT
            echo "profile=${{ github.event.inputs.profile }}" >> $GITHUB_OUTPUT
          else
            # TEMPORARY: skip push builds — EAS free-plan Android quota is
            # exhausted until Sep 1 2026 (spent shipping 1.1.0). Restore
            # platform=all after reset. Type check above still runs on push.
            echo "platform=skip" >> $GITHUB_OUTPUT
            echo "profile=preview" >> $GITHUB_OUTPUT
          fi

      - name: Materialize Firebase client configs
        if: steps.build-params.outputs.platform != 'skip'
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          # eas-cli evaluates app.config.js on this runner (iOS entitlements
          # resolution) before uploading, so both gitignored Firebase client
          # files must exist here — EAS build servers separately receive them
          # via the GOOGLE_SERVICE_INFO_PLIST / GOOGLE_SERVICES_JSON file-type
          # env vars in the EAS environment.
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_B64" ] || [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::Repo secrets GOOGLE_SERVICE_INFO_PLIST_B64 and GOOGLE_SERVICES_JSON_B64 are required for CI builds."
            echo "Create them from the local files: base64 -i mobile-app/GoogleService-Info.plist and base64 -i mobile-app/google-services.json"
            echo "(GitHub repo -> Settings -> Secrets and variables -> Actions). Alternatively build from a machine that has the files: npx eas-cli build --platform all --profile production"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 -d > GoogleService-Info.plist
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > google-services.json

      - name: Build (all platforms)
        if: steps.build-params.outputs.platform == 'all'
        run: eas build --platform all --profile ${{ steps.build-params.outputs.profile }} --non-interactive

      - name: Build (iOS only)
        if: steps.build-params.outputs.platform == 'ios'
        run: eas build --platform ios --profile ${{ steps.build-params.outputs.profile }} --non-interactive

      - name: Build (Android only)
        if: steps.build-params.outputs.platform == 'android'
        run: eas build --platform android --profile ${{ steps.build-params.outputs.profile }} --non-interactive

  submit-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.profile == 'production'
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Expo
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to stores
        run: |
          echo "Production build complete. Submit manually via EAS dashboard or run:"
          echo "eas submit --platform ios --latest"
          echo "eas submit --platform android --latest"
