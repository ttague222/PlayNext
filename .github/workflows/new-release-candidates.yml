# PlayNxt — monthly new-release candidate PR (spec 2026-09-22)
#
# Fetches recent + upcoming releases from Steam's public store search (no key;
# RAWG was the source until it went unreachable around 2026-11-05), filters out
# games already in the catalog, and opens a PR with a candidate JSON whose
# curation fields are blank. A human fills them in on the PR branch, then seeds
# with seed_refresh.py. This workflow NEVER writes to Firestore.
#
# Requires:
#   - Repo setting "Allow GitHub Actions to create and approve pull requests"
#     enabled (Settings > Actions > General > Workflow permissions). Without
#     it, create-pull-request silently fails to open the PR even though the
#     pull-requests: write permission below is granted.

name: New Release Candidates

on:
  schedule:
    - cron: '0 9 5 * *'   # 5th of each month, 09:00 UTC
  workflow_dispatch:

jobs:
  candidates:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate candidate file
        working-directory: api-service/scripts
        run: python new_release_candidates.py

      # One branch and PR per month. With a single shared branch, each run
      # force-pushed over the previous month's PR, wiping any curation that
      # had not been merged yet. UTC, matching the script's file name.
      - name: Month
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Open candidate PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: catalog/new-release-candidates-${{ steps.month.outputs.month }}
          commit-message: "data: new-release candidates for ${{ steps.month.outputs.month }} (uncurated)"
          title: "Catalog: new-release candidates for ${{ steps.month.outputs.month }}"
          body: |
            Automated monthly candidate list from Steam (popular releases from the
            last 45 days and the most-wishlisted ones due in the next 60, with
            already-cataloged and tombstoned games removed).

            Steam only knows the PC version, so `platforms` says `pc`: add console
            and mobile platforms by hand. Console exclusives never appear here.

            **Before merging:** fill in every `FILL_ME` and empty curation field
            (`time_tags`, `energy`, `moods`, `play_style`, `time_to_fun`,
            `stop_friendliness`, `multiplayer`, `description`) — these are
            hand-curated, never scraped. Also shorten each `id` to the catalog's
            usual hand-shortened convention — slugs made from Steam titles are often
            long and awkward; check existing entries under `games_data/` for examples.
            Delete entries that don't belong. After merge, seed with:
            `python seed_refresh.py --file=<candidate file> --apply`
          add-paths: api-service/scripts/games_data/candidates_*.json
          delete-branch: true
